# Builds a signed freeRelease APK and publishes it as a GitHub Release asset
# on every push to develop (auto-numbered vX.Y.Z-fork.N) or a vX.Y.Z-fork.N tag.
# versionCode = upstream versionCode * 100 + N, so updates always install.
# Obtainium: https://github.com/andersliland/AntennaPod (app id
# xyz.liland.antennapod, APK filter AntennaPod-.*\.apk). Private F-Droid: the
# alto fdroid CronJob pulls the newest Release APK automatically (<= 6h) and
# serves it at https://fdroid.liland.xyz/fdroid/repo.
# Requires secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. See docs/OBTAINIUM.md + docs/FDROID.md.
name: Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (false = build + verify only, APK as artifact)"
        required: false
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
      - name: Resolve fork release number
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_NAME=$(grep -E 'versionName\s+"' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            N="${TAG##*-fork.}"
          else
            git fetch --tags --force --quiet
            LAST=$(git tag -l "v${BASE_NAME}-fork.*" | sed -E 's/.*-fork\.([0-9]+)$/\1/' | sort -n | tail -1)
            N=$(( ${LAST:-0} + 1 ))
            TAG="v${BASE_NAME}-fork.${N}"
          fi
          if ! [[ "$N" =~ ^[0-9]+$ ]] || (( N < 1 || N > 99 )); then
            echo "fork release number must be 1..99 (got '$N' from ${TAG})" >&2
            exit 1
          fi
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=${BASE_NAME}-fork.${N}" >> "$GITHUB_OUTPUT"
      - name: Build signed freeRelease APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleFreeRelease \
            -PreleaseStoreFile=release.keystore \
            -PreleaseStorePassword="$RELEASE_STORE_PASSWORD" \
            -PreleaseKeyAlias="$RELEASE_KEY_ALIAS" \
            -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD" \
            -PforkReleaseNumber="${{ steps.ver.outputs.n }}"
      - name: Verify signer + versionCode
        id: meta
        run: |
          APK_SRC=$(ls app/build/outputs/apk/free/release/*.apk | head -1)
          APK_NAME="AntennaPod-${{ steps.ver.outputs.version_name }}.apk"
          cp "$APK_SRC" "$APK_NAME"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK_NAME" | head -1
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_NAME" | tee signer.txt
          grep -qi 'SHA-256 digest: f866a4a8963a55c0b449575e2ca15d363386c37eb2c60c70ea47333b1d140767' signer.txt \
            || { echo "APK not signed with the fork release key" >&2; exit 1; }
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact (dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.meta.outputs.apk_name }}
      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AntennaPod ${{ steps.ver.outputs.version_name }}
          make_latest: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
