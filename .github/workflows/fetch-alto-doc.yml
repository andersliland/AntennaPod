name: Fetch alto admark contract
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ANTENNAPOD_INTEGRATION.md from alto PR branch
        env:
          ALTO_DISPATCH_TOKEN: ${{ secrets.ALTO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ALTO_DISPATCH_TOKEN}" ]; then
            echo "ALTO_DISPATCH_TOKEN missing" >&2
            exit 1
          fi
          for ref in cursor/admark-proxied-feed-audio-5a41 develop main master; do
            echo "Trying ref=$ref"
            code=$(curl -sS -o doc.md -w "%{http_code}" \
              -H "Authorization: Bearer ${ALTO_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/andersliland/alto/contents/services/admark/docs/ANTENNAPOD_INTEGRATION.md?ref=${ref}" || true)
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              echo "=== DOC BEGIN ==="
              cat doc.md
              echo "=== DOC END ==="
              exit 0
            fi
            # also try without docs/ subdir
            code=$(curl -sS -o doc.md -w "%{http_code}" \
              -H "Authorization: Bearer ${ALTO_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/andersliland/alto/contents/services/admark/ANTENNAPOD_INTEGRATION.md?ref=${ref}" || true)
            echo "alt path HTTP $code"
            if [ "$code" = "200" ]; then
              echo "=== DOC BEGIN ==="
              cat doc.md
              echo "=== DOC END ==="
              exit 0
            fi
          done
          # list tree as fallback
          curl -sS -H "Authorization: Bearer ${ALTO_DISPATCH_TOKEN}" \
            "https://api.github.com/repos/andersliland/alto/git/trees/cursor/admark-proxied-feed-audio-5a41?recursive=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message',''));
[print(t['path']) for t in d.get('tree',[]) if 'admark' in t['path'].lower() or 'ANTENNA' in t['path'] or 'integrat' in t['path'].lower()]"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alto-admark-contract
          path: doc.md
          if-no-files-found: ignore
